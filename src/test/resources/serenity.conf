serenity {
    project.name = "Automation Booking - Selenium Screenplay"
    take.screenshots = AFTER_EACH_STEP
    logging = VERBOSE
}

headless.mode = false

webdriver {
    driver = chrome
    capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
            args = ["start-maximized","incognito","disable-infobars","disable-notifications"]
        }
    }
    timeouts {
        implicitlywait = 2000
    }
    wait.for.timeout = 10000
}

environments {
    default {
        webdriver.base.url = "https://automationintesting.online/"
    }
    qa {
        webdriver.base.url = "https://automationintesting.online/"
    }
    all {
        home.page = "#{webdriver.base.url}"
        admin.page = "#{webdriver.base.url}/admin"
    }
}